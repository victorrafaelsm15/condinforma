    <!--
      Tags Open Graph/Twitter ESTÁTICAS aqui de propósito: bots de preview de
      link (WhatsApp, Facebook, Twitter/X, Slack) não executam JavaScript,
      então as tags dinâmicas injetadas via react-helmet-async (ver
      src/components/common/Seo.jsx) são invisíveis pra eles — só o HTML
      bruto conta. Como o app é uma SPA com HashRouter servida deste mesmo
      index.html pra qualquer rota, isto aqui vira o preview de
      compartilhamento PADRÃO pra qualquer link do site (não é possível ter
      um preview diferente por rota interna sem SSR/pré-renderização, fora
      do escopo atual). As tags dinâmicas continuam valendo pra título de
      aba, Googlebot (que executa JS) e dados estruturados (JSON-LD) da
      landing page.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cond-Informa" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://condinforma.vercel.app/" />
    <meta property="og:title" content="Cond-Informa — Checklists digitais com QR Code para condomínios" />
    <meta property="og:description" content="Checklists digitais com QR Code para condomínios: organize limpeza, zeladoria e manutenção por ambiente, com fotos, histórico e transparência total para os moradores." />
    <meta property="og:image" content="https://condinforma.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:title" content="Cond-Informa — Checklists digitais com QR Code para condomínios" />
    <meta name="twitter:description" content="Checklists digitais com QR Code para condomínios: organize limpeza, zeladoria e manutenção por ambiente, com fotos, histórico e transparência total para os moradores." />
    <meta name="twitter:image" content="https://condinforma.vercel.app/og-image.png" />
